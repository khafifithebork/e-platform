[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "language-platform-backend"
version = "0.0.0"
description = "Curated language-learning subscription platform — Django backend"
requires-python = ">=3.12"

# Exact pins. Every version here is what pip actually resolved, not a guess.
# M0 deliberately did NOT include DRF, drf-spectacular, django-celery-beat,
# django-axes or argon2-cffi: no M0 deliverable required them, and CLAUDE.md
# section 5 gates dependencies on the milestone that needs them. Each has since
# arrived with the milestone that needed it; django-celery-beat was the last,
# at M14 T4.
dependencies = [
    "django==5.2.17",
    "djangorestframework==3.18.0",
    "drf-spectacular==0.30.0",
    "django-environ==0.14.0",
    # Argon2 password hashing (architecture.md 4.2).
    "argon2-cffi==25.1.0",
    # Two-factor authentication on the admin site (architecture.md 8, ADR-018
    # 2). Versions read from the installed packages, not recalled.
    "django-otp==1.7.0",
    # Renders the enrolment QR code in a terminal, so bootstrapping the first
    # administrator needs no admin site to reach.
    "qrcode==8.2",
    # Brute-force lockout on login.
    "django-axes==8.3.1",
    # Content-Security-Policy (architecture.md §8, ADR-022 §4). Version read
    # from the installed package, not recalled — django-csp 4.0 replaced the
    # per-directive `CSP_*` settings with a single policy dict, so a version
    # written from memory would configure nothing and fail silently.
    "django-csp==4.0",
    # Presigned uploads against any S3-compatible store: MinIO in
    # development, Cloudflare R2 in production (ADR-012 §2).
    "boto3==1.43.74",
    "psycopg[binary]==3.3.4",
    "gunicorn==26.0.0",
    "uvicorn==0.52.3",
    # The Gunicorn worker class moved out of uvicorn core into its own
    # distribution; `uvicorn.workers.UvicornWorker` is deprecated.
    "uvicorn-worker==0.4.0",
    "celery==5.6.3",
    "redis==8.1.0",
    # Beat's schedule, kept in Postgres. ADR-001 §2.2 settled the placement at
    # M0 and said it "lands with the first periodic task, not in M0" — M14 T4
    # is that task. Celery's own scheduler persists to a local file, which
    # invariant 5 forbids on a stateless app tier; this replaces it, and the
    # schedule becomes inspectable from Django Admin as a side effect.
    #
    # It brings three transitive dependencies of its own — cron-descriptor,
    # django-timezone-field and python-crontab — pinned here because they are
    # now part of what CI audits, and a floating transitive is a build that
    # fails for a reason nobody changed. Versions read from pip, not recalled.
    "django-celery-beat==2.9.0",
    "cron-descriptor==1.4.5",
    "django-timezone-field==7.2.2",
    "python-crontab==3.3.0",
    # Error reporting (M14 T5, ADR-027). Approved under §5 on 2026-08-29.
    # Version read from the installed package in backend/.venv, not recalled.
    #
    # Unlike django-celery-beat above, this pins no transitives: it requires
    # certifi and urllib3, and both were already in the tree via boto3, so
    # installing it added exactly one distribution. Measured, not assumed —
    # pip reported only sentry-sdk as collected.
    #
    # The Django and Celery integrations auto-enable from the packages already
    # present, so neither is imported anywhere; `apps/core/observability.py` is
    # the only module that names the vendor at all.
    "sentry-sdk==2.68.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.3",
    # Used by the test that checks the CI workflow supplies every required
    # environment variable. Installed transitively by drf-spectacular, but a
    # test should not depend on another package's dependency staying put.
    "pyyaml==6.0.3",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
    # architecture.md §8.4 asks for a dependency audit in CI and M12 T4 is
    # where it arrives. Pinned like everything else: an audit tool that
    # floats can start failing a build for a reason unrelated to this
    # repository's dependencies.
    "pip-audit==2.9.0",
]

# This is an application, not a library. Nothing is importable from site-
# packages; `pip install .` exists only to install the dependency set into the
# container image.
[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "DJ",   # flake8-django
    "S",    # bandit
    "SIM",  # simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Assertions are the point of a test file. S105/S106 flag string literals that
# look like passwords: in tests those are fixtures for accounts that exist for
# milliseconds in a throwaway database, and the alternative — generating them —
# would obscure what each test is actually doing.
"tests/**" = ["S101", "S105", "S106"]
# Settings modules legitimately re-export with star imports.
"config/settings/*" = ["F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config"
