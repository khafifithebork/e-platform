# Local development stack.
#
# Requires a .env at the repository root providing DJANGO_SECRET_KEY and
# POSTGRES_PASSWORD. `make bootstrap` generates it; `make dev` runs bootstrap
# first, so a fresh clone needs no manual step.
#
# No credential is written here. CLAUDE.md section 6 forbids committing
# environment variable values, and "it is only local" is how that habit starts.
# The `:?` substitutions fail with an actionable message rather than silently
# defaulting to something guessable.
#
# Host ports are overridable. Container ports are fixed; only the host side
# moves. A developer machine running more than one project will collide on 3000
# or 5432 eventually, and the fix should be a variable rather than an edit to a
# tracked file. Defaults are the conventional ports, so nothing changes unless
# you set one:
#
#   WEB_PORT=3001 make dev

name: eplatform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Names, not credentials.
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run "make bootstrap" to generate a local .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # Dependents wait on this rather than racing a database that has accepted
      # a TCP connection but is not yet ready to answer.
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Redis is disposable by design (architecture.md 3.4): it holds the queue
    # and cache and never the only copy of anything, so there is no volume.

  storage:
    # An S3-compatible store so presigned uploads are exercised for real
    # without a bill (ADR-012 §1). Production is Cloudflare R2; the difference
    # is the endpoint and the credentials, not the code.
    #
    # **Named for its role, not its vendor.** It was `minio` until 2026-09-25,
    # and renaming it is the lesson of having replaced the vendor twice in
    # eleven days: the next swap should touch this block and little else.
    #
    # **Why not MinIO any more.** MinIO gated their official images. Docker Hub
    # refused anonymous pulls on 2026-09-14, quay.io followed within eleven
    # days, and both now return 401 for *every* tag — `latest` and a 2024
    # release alike. Checked against both registry APIs directly rather than
    # inferred from a failed `docker pull`.
    #
    # **`S3_SKIP_SIGNATURE_VALIDATION=0` is load-bearing and is not the
    # default.** LocalStack ships with presigned-signature validation *off*,
    # and two tests in `test_object_storage.py` assert the store answers 403
    # when the content type or the object key is tampered with — abuse case 2,
    # and the reason ADR-012 §1 made this adapter real rather than fake.
    # Provoked: at the default those two fail and the other fifteen pass, so
    # deleting this line turns a security control green and meaningless rather
    # than red.
    #
    # **`latest` will not do.** `localstack/localstack:latest` is the
    # licence-gated Pro image: it boots, then exits 55 demanding an auth token.
    # Pinned community releases need none.
    image: localstack/localstack:4.0.3
    ports:
      - "${STORAGE_PORT:-4566}:4566"
    environment:
      SERVICES: s3
      S3_SKIP_SIGNATURE_VALIDATION: "0"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    # No volume: development uploads are disposable, and a persisted bucket
    # would quietly accumulate test videos.

  mailpit:
    # Pinned to a version confirmed by running the image and reading back
    # `mailpit version`, then pulling this exact tag.
    image: axllent/mailpit:v1.30.7
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
      - "${MAILPIT_UI_PORT:-8025}:8025" # web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  api:
    build:
      context: ./backend
      target: dev
    environment: &django-env
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?run "make bootstrap" to generate a local .env}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      # The origin the *browser* uses, which is never the one Django sees:
      # Next forwards its rewrite destination as the Host header. Without this
      # every unsafe request through the proxy fails the CSRF origin check.
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:${WEB_PORT:-3000}
      # Local only, and still not "admin": a developer who habitually types
      # /admin/ will type it in production too.
      DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:-staff-console-local}
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?run "make bootstrap"}@postgres:5432/app
      REDIS_URL: redis://redis:6379/0
      # Database 1, not 0. A cache flush must not empty the task queue.
      REDIS_CACHE_URL: redis://redis:6379/1
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      # Reached over the compose network, so the service name rather than
      # localhost. The presigned URLs it generates carry this host, so the
      # upload flow is exercised from inside the network or from the test
      # suite against the published port.
      #
      # The comment here previously pointed at a `MINIO_PUBLIC_ENDPOINT`
      # variable "below" that this file has never defined.
      MEDIA_STORAGE_ENDPOINT: http://storage:4566
      MEDIA_STORAGE_BUCKET: ${MEDIA_STORAGE_BUCKET:-media}
      MEDIA_STORAGE_ACCESS_KEY: ${MEDIA_STORAGE_ACCESS_KEY:-test}
      MEDIA_STORAGE_SECRET_KEY: ${MEDIA_STORAGE_SECRET_KEY:-test}
    volumes:
      # Source is mounted so --reload works. /opt/venv lives outside /app, so
      # the mount cannot shadow the installed dependencies.
      - ./backend:/app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      # A real request to /healthz, not the TCP probe this used to be. An open
      # port only proves something is listening; this proves the application
      # answers. Uses python rather than curl, which the image does not ship.
      #
      # 127.0.0.1 is in DJANGO_ALLOWED_HOSTS below — without that this would
      # get a 400 from Django's host validation before reaching the view.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  worker:
    build:
      context: ./backend
      target: dev
    # --beat, as of M14 T4 — the first periodic task, which is exactly when
    # ADR-001 section 2.2 said Beat would arrive. The scheduler is
    # django-celery-beat's DatabaseScheduler, so the schedule lives in Postgres
    # rather than in a local file that invariant 5 forbids.
    #
    # THIS SERVICE MUST NEVER SCALE PAST ONE REPLICA. Two beats means every
    # scheduled job runs twice: double emails, double charges, double expiry
    # sweeps. That warning predates the flag; the flag is what made it live.
    command: celery -A config worker --beat --scheduler django_celery_beat.schedulers:DatabaseScheduler --loglevel=info
    environment: *django-env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      target: dev
    environment:
      # Server-side only. The browser talks to localhost:3000 and Next proxies
      # /api/* onward, which is what keeps everything same-origin (ADR-001 2.1).
      API_ORIGIN: http://api:8000
    volumes:
      - ./frontend:/app
      # Anonymous volume: without it the bind mount above would shadow the
      # container's node_modules with the host's, which are built for a
      # different platform.
      - /app/node_modules
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
