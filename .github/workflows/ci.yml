name: CI

# Every push and every pull request. CLAUDE.md section 8 requires these checks
# to gate merges — a check that does not block is a check nobody fixes.
on:
  push:
    branches: ["**"]
  pull_request:

# A superseded run tells you nothing. Cancel it and save the minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # From M2 the suite has models, so tests need a real database. Postgres
    # rather than SQLite deliberately: the schema relies on Postgres-specific
    # behaviour — functional unique constraints, and later JSONB and full-text
    # search — so a test passing against SQLite would prove nothing about
    # production.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Ephemeral, reachable only from this runner, destroyed when the job
          # ends. It grants access to nothing and is not a secret; a repository
          # secret here would teach the wrong habit.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    # Every `run` in this job executes in backend/, where pyproject.toml,
    # manage.py and the test suite live. Removing this does not fail loudly at
    # one step — it silently relocates all of them, which is how the install
    # step ended up reporting "Neither 'setup.py' nor 'pyproject.toml' found".
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Editable, so `pip-audit` can tell this project apart from its
          # dependencies. A non-editable install registers
          # `language-platform-backend 0.0.0` as a distribution, and the audit
          # then tries to look it up on PyPI — where it will never be, because
          # pyproject says plainly that this is an application and `pip install`
          # exists only to install the dependency set.
          pip install -e ".[dev]"

      # scripts/ is linted with the same configuration: it is Python that runs
      # in the migrate path, so it holds the same bar as application code.
      - name: Lint
        run: ruff check . ../scripts

      - name: Format
        run: ruff format --check . ../scripts

      # Not a `services:` container: Actions gives service containers no
      # command, so `minio` ran with no arguments, printed its usage and
      # exited — the job failed before a single test. `docker run` is the only
      # form that can pass `server /data`.
      - name: Start object storage
        run: |
          # Ephemeral, reachable only from this runner, destroyed with the
          # job — the same reasoning as the Postgres credentials above.
          docker run -d --name storage -p 4566:4566 -e SERVICES=s3 -e S3_SKIP_SIGNATURE_VALIDATION=0 localstack/localstack:4.0.3
          # Poll rather than sleep: a fixed wait is either flaky or wasted.
          # /_localstack/health is LocalStack's own probe, confirmed against the
          # running image rather than taken from documentation.
          for attempt in $(seq 30); do
            if curl -fsS http://localhost:4566/_localstack/health >/dev/null; then
              echo "object storage ready after ${attempt}s"; exit 0
            fi
            sleep 1
          done
          echo "object storage did not become ready"; docker logs storage; exit 1

      # The preflight, against CI's own Postgres.
      #
      # Its real target is a Neon branch (M13 T8) — ADR-023 handed over that
      # `CREATE EXTENSION pg_trgm` had only ever run locally, as a superuser,
      # and "a managed provider may not grant it". Running it here does not
      # answer that question; it answers a different one that would otherwise
      # be discovered on the day it matters: **does the check itself work**.
      #
      # A preflight that has never run is a preflight nobody should trust at
      # the moment they most need it.
      - name: Database preflight
        env:
          # The full set base.py requires, not only the ones this command
          # touches. `manage.py` defaults to config.settings.local, which reads
          # every one of them at import — so a missing REDIS_URL stops a
          # database check that never opens a Redis connection.
          #
          # Locally this is supplied by backend/.env, which CI does not have.
          # That is the second time this exact gap has been shipped, and
          # test_ci_environment.py now covers every manage.py step rather than
          # only the deployment check.
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379/0
          REDIS_CACHE_URL: redis://localhost:6379/1
          MEDIA_STORAGE_ENDPOINT: http://localhost:4566
          MEDIA_STORAGE_BUCKET: media-ci
          MEDIA_STORAGE_ACCESS_KEY: test
          MEDIA_STORAGE_SECRET_KEY: test
        run: |
          # Not a credential and not reused: a throwaway for a process that
          # lives for one step. base.py reads DJANGO_SECRET_KEY with no default.
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          python manage.py migrate --noinput
          python manage.py check_database

      - name: Tests
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          MEDIA_STORAGE_ENDPOINT: http://localhost:4566
          MEDIA_STORAGE_BUCKET: media-ci
          MEDIA_STORAGE_ACCESS_KEY: test
          MEDIA_STORAGE_SECRET_KEY: test
        run: pytest

      # The dependency audit used to sit here. It now runs in `audit-backend`,
      # for the reason documented on that job: as a step it was ordered ahead of
      # the release-image build, the smoke test and the deployment check, so an
      # unfixable advisory skipped all three.

      # CLAUDE.md section 8 requires 100% branch coverage on the entitlement
      # resolver, and a target that is only reported is a target nothing
      # enforces. This fails the build rather than printing a number: a bug
      # here either gives the product away or locks out paying customers.
      - name: Entitlement resolver coverage
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          MEDIA_STORAGE_ENDPOINT: http://localhost:4566
          MEDIA_STORAGE_BUCKET: media-ci
          MEDIA_STORAGE_ACCESS_KEY: test
          MEDIA_STORAGE_SECRET_KEY: test
        run: >
          pytest tests/unit/test_resolve_access.py
          --cov=apps.entitlements.resolver
          --cov-branch
          --cov-fail-under=100
          --cov-report=term-missing

      # The image that would actually deploy, built for the first time in CI.
      # Everything above this line tests the *source* on a GitHub runner:
      # different Python, different OS packages, an editable install and the
      # dev dependency set. None of that exercises `--target runtime`, so a
      # Dockerfile that stopped building would be invisible until a deploy —
      # which is the worst moment to find out.
      #
      # Tagged with the commit SHA and **not pushed**. Pushing needs a
      # registry, a registry needs an account, and §11 #4 has not chosen a
      # platform yet. Building without pushing is the half that is decided.
      # Context is `.` because the job already runs in `backend/` — the
      # job-level `defaults.run.working-directory` that a test in this
      # repository exists to protect. A step-level override here would be the
      # exact thing that guard forbids, and it caught the first version of
      # this step.
      - name: Build the release image
        run: docker build --target runtime -t e-platform-backend:${{ github.sha }} .

      # Boot that image against production settings and see whether it works.
      # Not a repeat of the deployment check above: that one runs on the
      # runner, against a virtualenv with the dev dependency set installed.
      # This one runs inside the image, which is a different filesystem with a
      # different dependency set — and it is the exact failure M12 T7 hit,
      # where adding `django-csp` left every test green and the container dead
      # with `No module named 'csp'`.
      #
      # Runs from the repository root because the script drives docker rather
      # than Django, so it is one of the few things here that genuinely does
      # not belong in `backend/`.
      - name: Smoke the release image
        run: cd .. && bash scripts/smoke_release.sh e-platform-backend:${{ github.sha }}

      - name: Deployment check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          # Not credentials. check --deploy is a static inspection of settings
          # and opens no connection; these exist only so the fail-fast reads in
          # base.py are satisfied. Nothing here grants access to anything.
          DJANGO_ALLOWED_HOSTS: example.test
          DATABASE_URL: postgres://localhost:5432/app
          REDIS_URL: redis://localhost:6379/0
          # A different database from the broker, matching production. Nothing
          # connects here; check --deploy only inspects settings.
          REDIS_CACHE_URL: redis://localhost:6379/1
          MEDIA_STORAGE_ENDPOINT: https://storage.invalid
          MEDIA_STORAGE_BUCKET: media
          MEDIA_STORAGE_ACCESS_KEY: not-a-credential
          MEDIA_STORAGE_SECRET_KEY: not-a-credential
        run: |
          # Generated per run rather than stored. A repository secret would
          # imply this value matters; it does not, and storing it would only
          # teach the habit of putting keys in the repo settings.
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          python manage.py check --deploy

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    # Postgres, because the frontend build now needs a live API.
    #
    # M15 T4 makes the public catalogue statically generated (invariant 15):
    # `next build` reads every published course from Django and bakes it into
    # the HTML, so a visitor's page load touches no API at all. The cost is
    # that the *build* does, and this is where it gets one.
    #
    # The alternative was mocking the fetch in CI, which would mean the build
    # never exercises the thing invariant 15 exists to guarantee — and abuse
    # case 6 is specifically that an unreachable API must fail the build rather
    # than silently ship a site with an empty catalogue. A mock cannot fail
    # that way.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Ephemeral and reachable only from this runner, like the backend
          # job's. It grants access to nothing and is not a secret.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # Redis, because the catalogue endpoints are throttled and DRF keeps
      # throttle counters in the default cache — which is Redis. Without it the
      # first catalogue request raises a connection error and the build fails
      # for a reason that has nothing to do with the catalogue.
      #
      # Found by importing settings with no .env file rather than by watching
      # CI fail: locally every one of these variables was being supplied by
      # backend/.env, which CI does not have.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Runs `next typegen` first. Next generates route and layout types into
      # .next/types, which is a build artifact and not in version control, so a
      # bare `tsc --noEmit` fails on a clean checkout with an unresolved
      # LayoutProps. This is exactly the difference between a developer machine
      # that has built once and CI, which never has.
      # Invariant 16: these types are generated, never hand-written. If
      # regenerating them changes anything, the committed copy is stale and the
      # frontend is being type-checked against an API that no longer exists.
      #
      # The backend half of this contract — that docs/openapi.yaml still
      # matches the code — is asserted by a test in the backend job.
      - name: Generated types are current
        run: |
          npm run types
          git diff --exit-code src/types/api.d.ts

      # The dependency audit used to sit here, ahead of everything below it.
      # It now runs in `audit-frontend` — see that job for what that cost us on
      # 2026-10-03.

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Vitest, which this comment promised at M2 and which arrived at M15 T2.
      # For twelve milestones it said "there is no test runner yet — Vitest
      # arrives with the first component in M2", while six client components
      # shipped without one. That is the pattern ADR-023 §1 names, and the
      # comment itself was the thing keeping it invisible.
      #
      # Before the build, deliberately: a failing unit test should not wait on
      # a Next production build to be reported.
      - name: Test
        run: npm run test

      - name: Test bundle budget guard
        run: node --test scripts/assert-bundle-budget.test.mjs

      # The API the build reads from.
      #
      # Deliberately after the tests and the audit: those need no database, and
      # standing Django up in front of them would make a unit-test failure wait
      # on a migration run.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install the API
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # No [dev]: this install exists to *run* the API, not to test it.
          # The backend job owns the test dependencies.
          pip install -e .

      - name: Start the API
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
          # Not a credential and not reused: a throwaway value for a server
          # that exists for the length of one build and signs nothing anybody
          # will ever present again. `base.py` reads DJANGO_SECRET_KEY with no
          # default, and locally that is satisfied by backend/.env — which CI
          # does not have, so without this the API fails to start with
          # ImproperlyConfigured.
          DJANGO_SECRET_KEY: not-a-secret-this-server-lives-for-one-build
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379/0
          REDIS_CACHE_URL: redis://localhost:6379/1
          # Object storage is never touched by the catalogue endpoints, but
          # settings read these at import time and fail fast without them.
          # Pointing at a port with nothing on it is honest: if a build ever
          # starts needing storage, it fails here rather than silently working
          # against something it should not be using.
          MEDIA_STORAGE_ENDPOINT: http://localhost:4566
          MEDIA_STORAGE_BUCKET: media-ci
          MEDIA_STORAGE_ACCESS_KEY: not-a-credential
          MEDIA_STORAGE_SECRET_KEY: not-a-credential
        run: |
          python manage.py migrate --noinput
          # A catalogue with courses in it, because a build against an empty
          # database generates no course pages at all — so `/courses/[slug]`
          # would be a route that answers 404 to everything, and T5's whole
          # `generateStaticParams` path would go untested by this pipeline.
          # `verify:static` caught exactly that on the first run of this job.
          #
          # 25 rather than a handful, and the number is the point: DRF's
          # PAGE_SIZE is 20, so this crosses the page boundary and exercises
          # the paginated read. An earlier version of that loader took only the
          # first page — which works perfectly against a development database
          # with one course, and silently publishes a catalogue of exactly
          # twenty the day the twenty-first is approved.
          #
          # The command is idempotent, refuses to run with DEBUG off, and
          # writes under a recognisable slug prefix. It was written for M12's
          # load-test baseline and is reused here rather than duplicated.
          python manage.py seed_catalogue --courses 25 --languages 4
          python manage.py runserver 0.0.0.0:8000 --noreload &
          # Poll rather than sleep, the same reasoning as the backend job's
          # object storage: a fixed wait is either flaky or wasted.
          for attempt in $(seq 30); do
            if curl -fsS http://localhost:8000/healthz >/dev/null; then
              echo "api ready after ${attempt}s"; exit 0
            fi
            sleep 1
          done
          echo "api did not become ready"; exit 1

      # The build is also a behavioural check in its own right — it executes
      # next.config.ts and would fail on an invalid rewrite, which no unit test
      # covers. As of M15 T4 it is more than that: it reads the catalogue and
      # fails if it cannot, which is abuse case 6 enforced by the pipeline
      # rather than by a comment.
      - name: Build
        env:
          API_ORIGIN: http://localhost:8000
        run: npm run build

      # Invariant 15, checked against the build rather than the source.
      #
      # The Vitest suite greps page files for `searchParams`, a `fetch` call or
      # a `dynamic` export. Those are proxies and proxies are all they can be:
      # they cannot see a route that went dynamic for a reason nobody wrote
      # down — a dependency reading headers, a Next default changing in a minor
      # release, a `cookies()` call three components deep.
      #
      # Next records what it actually did, and this compares
      # app-path-routes-manifest against prerender-manifest. It is the only
      # check here that cannot be fooled by how the code is written, and it
      # catches the one case `next build` reports identically either way:
      # removing `dynamicParams = false` leaves the printed route table
      # unchanged and flips `fallback` from false to null.
      - name: Public routes are static
        run: npm run verify:static

      # Document structure, on the HTML a visitor receives.
      #
      # The component tests query the accessibility tree, which is the right
      # place for "is this control labelled". They cannot see what only exists
      # once a page is assembled: two components each rendering an <h1>, a
      # heading level skipped because a section moved, a landmark duplicated by
      # a layout change. All three survive a green component suite, and M15 T10
      # found all three — /courses and /pricing jumped h1 to h3, and
      # /reset-password prerendered with no heading at all because its content
      # sits behind a Suspense boundary.
      - name: Document structure
        run: npm run verify:a11y

      # Design tokens, on the CSS a browser actually parses.
      #
      # Tailwind 4 reads `rounded-(--radius-md)` as `var(--radius-md)` and
      # `rounded-[--radius-md]` — the Tailwind 3 spelling — as the literal value
      # `--radius-md`, which is invalid, so the browser drops the declaration.
      # 45 classes across 15 components were the second form and had never once
      # applied: this project has been on `^4` since its first frontend commit.
      # Nothing could see it. Both spellings are valid strings in a `className`,
      # so `tsc` and ESLint pass either way, and jsdom runs no Tailwind so no
      # component test can tell. Measured on /login, where the submit button
      # computed a 12px radius and the two inputs above it computed 0px.
      #
      # This asserts the property rather than the spelling — no declaration may
      # have a bare custom-property name as its value — so it also catches
      # variants nobody has thought of. `src/test/css-tokens.test.ts` is the fast
      # half, in the unit suite, for the spelling already known to be wrong.
      - name: Design tokens resolve
        run: npm run verify:css

      # The per-route first-load budget, approved 2026-10-03.
      #
      # `docs/specs/frontend-state-and-api.md` §11 proposed 350 KB gzipped per route
      # and said enforcing it "should be a script beside `verify:static` and
      # `verify:css` rather than a number in a document nobody runs". This is that,
      # and it runs here for the same reason the others do: measured on the build a
      # visitor would receive, not on an estimate.
      #
      # **The headroom is for a dependency, not for features.** Seven batches of the
      # quality addendum moved the worst route 1.3 KB — 0.4% — against 23 KB of slack,
      # so a failure here is far more likely to mean something arrived in the shared
      # chunks than that somebody wrote too much code. The message says so.
      #
      # It cannot cover the lesson route, which is dynamic (ADR-026) and so has no
      # prerendered HTML — and that is the route a learner actually waits on. §11
      # records that as a person's job with a network panel.
      - name: First-load budget
        run: npm run verify:bundle

      # And again inside the image, which is not the same build. `npm run
      # build` above runs on the runner with the full dependency tree; the
      # image builds on node:22-slim, installs with `npm ci --omit=dev`, and
      # ships `.next/standalone`. A difference between those two is exactly
      # the class of failure that only appears at deploy time.
      #
      # Not pushed, for the reason the backend job gives.
      # `--network=host` so the build container can reach the Django this job
      # started, and `--build-arg` so the builder stage knows where to look.
      #
      # The image bakes the catalogue in at build time — that is what invariant
      # 15 asks for — so building it needs the API exactly as the earlier
      # `npm run build` step does. Without both flags the build fails inside
      # Docker with CatalogueUnavailable, which is the check working rather
      # than a defect, in a context nobody had given an API to.
      - name: Build the release image
        run: |
          docker build --network=host             --build-arg API_ORIGIN=http://localhost:8000             --target runtime -t e-platform-frontend:${{ github.sha }} .

  # ---------------------------------------------------------------------------
  # Dependency audits — separate jobs since 2026-10-03
  #
  # **Why these are jobs and not steps.** Both audits used to run inside the
  # `backend` and `frontend` jobs, early, and GitHub stops a job at its first
  # failing step. So on 2026-10-03 a `braces` advisory with **no patched version
  # at any release** turned the frontend audit permanently red, and the eleven
  # steps behind it — type check, lint, the 649 tests, the build, and all four
  # `verify:*` scripts, including the first-load budget gate added in the same
  # pull request — were reported as *skipped*. CI could no longer say whether
  # any change was correct, on any branch, for as long as the advisory stood.
  #
  # That is a worse failure than the advisory. A gate whose red light hides
  # every other light is not a stricter gate, it is a darker one.
  #
  # **What this does not change**, which matters more than what it does. Same
  # commands, same thresholds, same editable install, no `continue-on-error`,
  # and both jobs are in `deploy-staging`'s `needs` — so a failing audit still
  # fails the pull request and still blocks a deploy. The audits are exactly as
  # strict as architecture.md §8.4 and ADR-022 §3 require. The only thing that
  # changed is that failing one no longer hides the rest of the pipeline.
  #
  # Guarded in `test_ci_environment.py` and `test_deploy_pipeline.py`: both
  # ways this refactor could quietly weaken things — losing an audit, or
  # dropping it from the deploy gate — are asserted, because this is precisely
  # the shape of change that looks harmless in review.
  # ---------------------------------------------------------------------------
  audit-backend:
    name: Audit (backend)
    runs-on: ubuntu-latest

    # No Postgres and no Redis: an audit reads metadata and talks to OSV. The
    # services the `backend` job needs are for its tests.
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # **Editable, and that is load-bearing for the flag below**, not a
      # copy-paste from the `backend` job. A non-editable install registers
      # `language-platform-backend 0.0.0` as a distribution and the audit then
      # looks it up on PyPI, where it will never be.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # architecture.md §8.4: "pip-audit and npm audit in CI, CI fails on
      # high-severity". This is the backend half, and it is **stricter than
      # that line asks** because pip-audit has no severity filter — no
      # `--severity` flag exists, so the choice is "fail on any known
      # advisory" or "parse JSON and guess", and OSV entries frequently carry
      # no CVSS at all. A gate that silently passes what it cannot classify is
      # worse than one that is occasionally noisy.
      #
      # The escape hatch is per-advisory and reviewable: `--ignore-vuln GHSA-x`
      # with a comment saying who triaged it and why. That is deliberately more
      # awkward than raising a threshold, because raising a threshold is how a
      # security gate quietly stops covering anything.
      #
      # `--skip-editable` excludes exactly one package: this project, installed
      # editable above. `--strict` is deliberately absent and its absence does
      # **not** soften the vulnerability gate — it governs *dependency
      # collection* failures only, and a found advisory still exits 1 either
      # way (verified against a known-vulnerable pin). With `--strict` the two
      # flags contradict each other: it fails on any skipped dependency,
      # including the one `--skip-editable` was told to skip.
      - name: Dependency audit
        run: python -m pip_audit --skip-editable --progress-spinner off

  audit-frontend:
    name: Audit (frontend)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm audit` reads the lockfile and queries the registry, so it reports
      # the same advisories with no `node_modules` at all — checked, and the
      # exit code and finding count match. Installing anyway: this job runs in
      # parallel with the others so nothing waits on it, and keeping the
      # environment identical to the step this replaces means the split is
      # purely structural. If that ever stops being free, this is the line to
      # remove.
      - name: Install dependencies
        run: npm ci

      # The frontend half of the §8.4 audit. `--audit-level=high` is exactly
      # what that line specifies, and unlike pip-audit npm supports it
      # directly — npm advisories carry a severity, so filtering on one
      # classifies rather than discards.
      #
      # ADR-022 §3: not moderate. A gate that fires on things nobody will act
      # on this quarter is a gate that gets `|| true` appended during an
      # unrelated deadline, and the failure to design against is a disabled
      # audit nobody remembers.
      # Exceptions are exact development-only paths with a triager and expiry.
      # Run their regression tests in the same gating job (ADR-022 §3).
      - name: Dependency audit
        run: |
          node --test scripts/assert-dependency-audit.test.mjs
          node scripts/assert-dependency-audit.mjs

  # ---------------------------------------------------------------------------
  # Deploy — M13 T9
  #
  # The objective: "a merge to master reaches a running environment without
  # anybody typing a deploy command, and production is one approved action".
  #
  # **Jobs here rather than a separate workflow**, because `needs` is what makes
  # "only after the tests pass" structural rather than a convention. A
  # `workflow_run` trigger would express the same intent and would run against
  # the default branch's copy of the workflow, which is a subtlety nobody wants
  # to reason about at the moment a deploy is going wrong.
  #
  # **Dormant until switched on.** Every job below is gated on the repository
  # variable `DEPLOY_ENABLED`. Nothing exists to deploy to yet — no Cloudflare
  # account, no Hetzner box, no Neon project — and a pipeline that fails on
  # every merge until somebody provisions is a pipeline people learn to ignore.
  # Set the variable once the environments exist.
  #
  # **Ordering is not arbitrary**, and one step of it is a consequence of a
  # decision made in M15:
  #
  #   1. `check_database` — read-only, and cheap to fail. `0005_search_vector`
  #      is `atomic = False`, so learning about a missing extension from a
  #      half-applied migration costs an incident (M13 T8).
  #   2. `predeploy` — migrations, over the **direct** connection. Its advisory
  #      lock is session-scoped, and Neon's pooler does not support those.
  #   3. Backend, then frontend. **This order is forced**: the public catalogue
  #      is statically generated, so `next build` reads every published course
  #      from the API — building the frontend first would bake yesterday's
  #      catalogue against today's schema.
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to staging
    # **The audit jobs are in here deliberately.** Splitting the audits out of
    # `backend` and `frontend` would otherwise have stopped a failing audit from
    # blocking a deploy — a security gate quietly removed by a change whose
    # stated purpose was the opposite. `test_staging_needs_both_test_jobs` is
    # the control; it asserted exactly two names and had to be updated, which is
    # the test doing its job rather than being in the way.
    needs: [backend, frontend, audit-backend, audit-frontend]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # A GitHub Environment, which is where the secrets live and where a
    # protection rule can be attached. Staging has none: reaching it should
    # need no ceremony.
    environment:
      name: staging
      url: ${{ vars.STAGING_WEB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          api-origin: ${{ vars.STAGING_API_ORIGIN }}
          database-url-direct: ${{ secrets.DATABASE_URL_DIRECT }}
          django-secret-key: ${{ secrets.DJANGO_SECRET_KEY }}
          redis-url: ${{ secrets.REDIS_URL }}
          redis-cache-url: ${{ secrets.REDIS_CACHE_URL }}
          media-storage-endpoint: ${{ secrets.MEDIA_STORAGE_ENDPOINT }}
          media-storage-bucket: ${{ secrets.MEDIA_STORAGE_BUCKET }}
          media-storage-access-key: ${{ secrets.MEDIA_STORAGE_ACCESS_KEY }}
          media-storage-secret-key: ${{ secrets.MEDIA_STORAGE_SECRET_KEY }}
          dokploy-url: ${{ secrets.DOKPLOY_URL }}
          dokploy-api-key: ${{ secrets.DOKPLOY_API_KEY }}
          dokploy-application-ids: ${{ secrets.DOKPLOY_APPLICATION_IDS }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          worker-name: ${{ vars.STAGING_WORKER_NAME }}
          sentry-dsn-browser: ${{ secrets.SENTRY_DSN_BROWSER }}
          sentry-environment: staging

  deploy-production:
    name: Deploy to production
    needs: [deploy-staging]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # **This is "one approved action".** The environment carries a required
    # reviewer, configured in repository settings rather than here — GitHub
    # does not express protection rules in YAML, deliberately, so that a pull
    # request cannot remove its own gate.
    #
    # Staging having deployed first is the other half: the thing being approved
    # has already run somewhere.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_WEB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          api-origin: ${{ vars.PRODUCTION_API_ORIGIN }}
          database-url-direct: ${{ secrets.DATABASE_URL_DIRECT }}
          django-secret-key: ${{ secrets.DJANGO_SECRET_KEY }}
          redis-url: ${{ secrets.REDIS_URL }}
          redis-cache-url: ${{ secrets.REDIS_CACHE_URL }}
          media-storage-endpoint: ${{ secrets.MEDIA_STORAGE_ENDPOINT }}
          media-storage-bucket: ${{ secrets.MEDIA_STORAGE_BUCKET }}
          media-storage-access-key: ${{ secrets.MEDIA_STORAGE_ACCESS_KEY }}
          media-storage-secret-key: ${{ secrets.MEDIA_STORAGE_SECRET_KEY }}
          dokploy-url: ${{ secrets.DOKPLOY_URL }}
          dokploy-api-key: ${{ secrets.DOKPLOY_API_KEY }}
          dokploy-application-ids: ${{ secrets.DOKPLOY_APPLICATION_IDS }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          worker-name: ${{ vars.PRODUCTION_WORKER_NAME }}
          sentry-dsn-browser: ${{ secrets.SENTRY_DSN_BROWSER }}
          sentry-environment: production
