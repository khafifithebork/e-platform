openapi: 3.0.3
info:
  title: Language Platform API
  version: 1.0.0
  description: Curated language-learning subscription platform.
paths:
  /api/v1/admin-api/users/{id}/diagnostics/:
    get:
      operationId: admin_api_users_diagnostics_retrieve
      description: |-
        Everything known about one person's entitlement.

        Administrators only — ``role == ADMIN``, not ``is_staff`` (M3's
        distinction). This reads another person's billing history, which is the
        most sensitive read in the product outside the admin site itself.

        Deliberately read-only. Support diagnosing a problem should not be able to
        fix it by editing rows here; changing access means granting an override,
        which is recorded with a grantor and a reason.
      summary: Diagnose a user's entitlement
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDiagnostics'
          description: ''
        '403':
          description: Not an administrator.
        '404':
          description: No such user.
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Establish a session.

        `authenticate` runs through AxesStandaloneBackend first, so a locked
        account fails here exactly as a wrong password does — and says the same
        thing. Telling a caller "this account is locked" would confirm the address
        exists and tell them their guessing worked well enough to matter.

        Deliberately not CSRF-exempt. Forcing a victim's browser to sign in as the
        attacker is a real attack: everything they do next is recorded against the
        wrong account.
      summary: Sign in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: Signed in. A session cookie is set.
        '400':
          description: Credentials refused, or the account is locked. Deliberately
            one answer.
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Destroy the session.

        Idempotent, and permitted while unauthenticated: a client retrying after a
        timeout should not receive an error for succeeding twice, and refusing an
        anonymous caller would leak whether their session was still alive.
      summary: Sign out
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: Signed out. Idempotent.
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: |-
        Who am I.

        Identity comes from the session and nothing else. There is no path
        parameter, no query parameter and no header that selects a user — a
        stronger guarantee than filtering one out, because there is nothing to
        filter. architecture.md section 4.4 calls fetching by a client-supplied
        identifier the single most common IDOR in DRF codebases; the fix here is
        to never accept one.
      summary: The signed-in user
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '403':
          description: Not signed in.
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: |-
        Change the password of the signed-in user.

        The only endpoint here that requires authentication, so it uses the
        project default rather than AllowAny.
      summary: Change your password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Password changed.
        '400':
          description: Current password wrong, or new password rejected.
  /api/v1/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      description: |-
        Send a reset link.

        Always 202. §6.2 is explicit that this must never reveal whether an account
        exists, and a reset endpoint is the most attractive enumeration oracle in
        any application because it is designed to be used by people who are locked
        out and therefore unauthenticated.
      summary: Request a password reset
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '202':
          description: Accepted. Identical for unknown addresses.
  /api/v1/auth/password/reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      summary: Set a new password with a reset token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: Password changed. All sessions are invalidated.
        '400':
          description: Token invalid, or the new password was rejected.
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: |-
        Create an account and send a verification email.

        Always answers 202 with the same body. That is abuse case 1: a differing
        status, body, or field error would let someone test an address list against
        this endpoint and learn who has an account here.

        The response is 202 rather than 201 because the meaningful part — the email
        — has not happened yet, and because 201 with a Location header would imply
        a resource the caller may now fetch.
      summary: Register an account
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '202':
          description: Accepted. Identical whether or not the address was free.
        '400':
          description: Malformed input or a password that fails validation.
  /api/v1/auth/resend-verification/:
    post:
      operationId: auth_resend_verification_create
      description: |-
        Issue a fresh verification token.

        Same uniform response for the same reason, and it covers three cases that
        must look identical: no such account, an account already verified, and a
        genuine resend.
      summary: Resend the verification email
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '202':
          description: Accepted. Identical for unknown and verified addresses.
  /api/v1/auth/verify-email/:
    post:
      operationId: auth_verify_email_create
      description: |-
        Consume a verification token.

        Unlike registration this one may fail visibly: the caller is holding a
        token and needs to know it did not work. It still says only that the token
        is invalid, never which of unknown, expired or already-used applies —
        telling them would turn a failed guess into information.
      summary: Verify an email address
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: Email address verified.
        '400':
          description: Token unknown, expired or already used — deliberately not distinguished.
  /api/v1/catalogue/courses/:
    get:
      operationId: catalogue_courses_list
      description: |-
        Published courses, by slug.

        ``AllowAny`` is explicit and deliberate: DRF is configured to deny by
        default, so a public endpoint is an exemption, and an exemption is a thing
        to test rather than assume. ``authentication_classes = ()`` goes with it —
        the catalogue must behave identically for a signed-in visitor and an
        anonymous one, and skipping session lookup is also what keeps the response
        cacheable at the edge (invariant 15).

        Read-only because there is no public write anywhere in this product.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - catalogue
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicCourseList'
          description: ''
  /api/v1/catalogue/courses/{slug}/:
    get:
      operationId: catalogue_courses_retrieve
      description: |-
        Published courses, by slug.

        ``AllowAny`` is explicit and deliberate: DRF is configured to deny by
        default, so a public endpoint is an exemption, and an exemption is a thing
        to test rather than assume. ``authentication_classes = ()`` goes with it —
        the catalogue must behave identically for a signed-in visitor and an
        anonymous one, and skipping session lookup is also what keeps the response
        cacheable at the edge (invariant 15).

        Read-only because there is no public write anywhere in this product.
      summary: One published course, with its curriculum
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          pattern: ^[-\w]+$
        required: true
      tags:
      - catalogue
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCourseDetail'
          description: ''
        '404':
          description: No published course with that slug.
  /api/v1/catalogue/languages/:
    get:
      operationId: catalogue_languages_list
      description: |-
        Languages a visitor can actually browse.

        Unpaginated: this list is bounded by the number of languages taught, which
        is a handful, and a paginated filter control is a worse control.
      summary: Languages on offer
      tags:
      - catalogue
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Language'
          description: ''
  /api/v1/instructor/courses/:
    get:
      operationId: instructor_courses_list
      description: |-
        CRUD over the courses you own.

        There is deliberately **no publish action here at all**. An instructor's
        only forward move is ``submit-for-review``; the route to PUBLISHED exists
        solely in Django Admin, for admins (ADR-007 §2). Absence is a stronger
        guarantee than a permission check on an endpoint that exists.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - instructor
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseList'
          description: ''
    post:
      operationId: instructor_courses_create
      description: |-
        CRUD over the courses you own.

        There is deliberately **no publish action here at all**. An instructor's
        only forward move is ``submit-for-review``; the route to PUBLISHED exists
        solely in Django Admin, for admins (ADR-007 §2). Absence is a stronger
        guarantee than a permission check on an endpoint that exists.
      tags:
      - instructor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CourseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CourseRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
