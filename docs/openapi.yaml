          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/CourseReviewEvent'
    PaginatedLessonList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'
    PaginatedPublicCourseList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublicCourse'
    PaginatedSectionList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Section'
    PasswordChangeRequest:
      type: object
      description: |-
        Change a signed-in user's password.

        The current password is required even though the caller is authenticated —
        a session left open on a shared machine is exactly what this stops.
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - current_password
      - new_password
    PasswordResetConfirmRequest:
      type: object
      description: Consume a reset token and set a new password.
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - new_password
      - token
    PatchedCourseRequest:
      type: object
      description: |-
        An instructor's view of their own course.

        ``status``, ``published_at`` and ``instructor`` are read-only, and that is
        a security control rather than a convenience. A writable ``status`` would
        hand every instructor the publish button — the one thing
        ``architecture.md`` §3 promises they do not have — and a writable
        ``instructor`` would let them assign a course to somebody else, or claim
        one.

        Ownership comes from the session in ``perform_create``, never from the
        request body.
      properties:
        slug:
          type: string
          minLength: 1
          description: The public URL. Unique across the catalogue, not per instructor.
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        language:
          type: integer
        level:
          $ref: '#/components/schemas/LevelEnum'
        skill_areas:
          description: Free-form tags, e.g. ['listening', 'grammar'].
    PatchedLessonRequest:
      type: object
      description: |-
        ``section`` is writable, and the view narrows its queryset to the course
        in the URL — see ``InstructorLessonViewSet.get_serializer``. That is what
        turns another course's section id into a 400 rather than a cross-course
        write, a constraint the database cannot express because both rows are
        individually valid.

        ``is_preview`` is **read-only**, and that is a revenue control rather than
        a nicety. A preview lesson is free to everyone: it is the resolver's first
        branch, allowed before the caller is even identified. An instructor who
        could set the flag could mark every lesson in their course a preview and
        hand the whole thing away — not only their own work, because the
        subscription that pays for it is shared across the catalogue.

        Previews are therefore chosen by an admin, in the same review that decides
        publication (ADR-007 §2). This was writable when the field was inert, and
        only became a giveaway once M4 gave it meaning.
      properties:
        section:
          type: string
          format: uuid
        slug:
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
        lesson_type:
          $ref: '#/components/schemas/LessonTypeEnum'
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
    PatchedSectionRequest:
      type: object
      description: |-
        ``course`` is read-only: it comes from the URL, never the body.

        A writable ``course`` would let an instructor post a section into somebody
        else's course by id, which is precisely the hole the scoped queryset closes
        everywhere else.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
    PresignedUpload:
      type: object
      description: What the browser needs, and nothing reusable beyond this one upload.
      properties:
        url:
          type: string
          format: uri
          readOnly: true
        method:
          type: string
          readOnly: true
        headers:
          type: object
          additionalProperties:
            type: string
          readOnly: true
        object_key:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - expires_at
      - headers
      - method
      - object_key
      - url
    PublicCourse:
      type: object
      description: |-
        A catalogue card.

        ``instructor_name`` rather than the instructor's id or email: the
        catalogue is unauthenticated, and an email address on a public page is a
        spam list.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          description: The public URL. Unique across the catalogue, not per instructor.
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 200
        description:
          type: string
        language:
          allOf:
          - $ref: '#/components/schemas/Language'
          readOnly: true
        level:
          $ref: '#/components/schemas/LevelEnum'
        skill_areas:
          description: Free-form tags, e.g. ['listening', 'grammar'].
        instructor_name:
          type: string
          readOnly: true
        published_at:
          type: string
          format: date-time
          nullable: true
          description: Set when an admin approves. Null means it has never been live.
      required:
      - id
      - instructor_name
      - language
      - level
      - slug
      - title
    PublicCourseDetail:
      type: object
      description: |-
        The card plus the curriculum. Structure sells the course; content does
        not appear until someone is entitled to it.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          description: The public URL. Unique across the catalogue, not per instructor.
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 200
        description:
          type: string
        language:
          allOf:
          - $ref: '#/components/schemas/Language'
          readOnly: true
        level:
          $ref: '#/components/schemas/LevelEnum'
        skill_areas:
          description: Free-form tags, e.g. ['listening', 'grammar'].
        instructor_name:
          type: string
          readOnly: true
        published_at:
          type: string
          format: date-time
          nullable: true
          description: Set when an admin approves. Null means it has never been live.
        sections:
          type: array
          items:
            $ref: '#/components/schemas/PublicSection'
          readOnly: true
      required:
      - id
      - instructor_name
      - language
      - level
      - sections
      - slug
      - title
    PublicLesson:
      type: object
      description: |-
        A lesson as an anonymous visitor sees it: a title and a shape.

        ``body`` is absent from ``fields``, not hidden by a condition. Entitlements
        arrive in M4 and there is nothing to gate with yet, so the safe form is a
        serializer that has no way to render paid content at all — a field that is
        usually hidden is one wrong branch from being visible.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 200
        lesson_type:
          $ref: '#/components/schemas/LessonTypeEnum'
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_preview:
          type: boolean
          description: Watchable without a subscription. The entitlement resolver
            reads this in M4; it grants nothing on its own.
      required:
      - id
      - position
      - slug
      - title
    PublicSection:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/PublicLesson'
          readOnly: true
      required:
      - id
      - lessons
      - position
      - title
    RegisterRequest:
      type: object
      description: |-
        Registration input.

        Two fields, and that is the security control. DRF ignores fields it does
        not declare, so `role`, `is_staff` and `is_superuser` in a request body go
        nowhere — there is no path from here to them. Abuse case 3.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    ReorderRequest:
      type: object
      description: Shape only. Whether the ids are *yours* is decided in the service.
      properties:
        order:
          type: array
          items:
            type: string
            format: uuid
      required:
      - order
    Section:
      type: object
      description: |-
        ``course`` is read-only: it comes from the URL, never the body.

        A writable ``course`` would let an instructor post a section into somebody
        else's course by id, which is precisely the hole the scoped queryset closes
        everywhere else.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        course:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - course
      - created_at
      - id
      - position
      - title
      - updated_at
    SectionRequest:
      type: object
      description: |-
        ``course`` is read-only: it comes from the URL, never the body.

        A writable ``course`` would let an instructor post a section into somebody
        else's course by id, which is precisely the hole the scoped queryset closes
        everywhere else.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - position
      - title
    StudentProfile:
      type: object
      description: Output only.
      properties:
        display_name:
          type: string
      required:
      - display_name
    SubscriptionDiagnostic:
      type: object
      description: |-
        Includes `provider_subscription_id`, deliberately.

        It is the handle support needs to find the same subscription in the
        provider's own dashboard, and this endpoint is administrators only. It
        appears nowhere a subscriber can reach.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          $ref: '#/components/schemas/SubscriptionDiagnosticStatusEnum'
        current_period_end:
          type: string
          format: date-time
        trial_end:
          type: string
          format: date-time
          nullable: true
        cancel_at_period_end:
          type: boolean
          description: Cancellation requested; access continues until current_period_end.
        provider:
          type: string
          description: Which system told us about this. 'fake' until M8.
          maxLength: 32
        provider_subscription_id:
          type: string
          nullable: true
          description: The provider's opaque id. Null until a real provider exists.
          maxLength: 128
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - current_period_end
      - id
      - provider
      - status
    SubscriptionDiagnosticStatusEnum:
      enum:
      - TRIALING
      - ACTIVE
      - PAST_DUE
      - CANCELED
      - EXPIRED
      type: string
      description: |-
        * `TRIALING` - Trialing
        * `ACTIVE` - Active
        * `PAST_DUE` - Past due
        * `CANCELED` - Canceled
        * `EXPIRED` - Expired
    SubscriptionEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        event_type:
          $ref: '#/components/schemas/EventTypeEnum'
        from_status:
          type: string
          maxLength: 16
        to_status:
          type: string
          maxLength: 16
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - event_type
      - id
    UploadRequestRequest:
      type: object
      description: |-
        The only thing a client may choose about an upload.

        A closed accept-list rather than free text: an unlisted type has no magic
        signature to check it against, so accepting one would mean accepting bytes
        nothing can verify.
      properties:
        content_type:
          $ref: '#/components/schemas/ContentTypeEnum'
      required:
      - content_type
    UploadTicket:
      type: object
      description: 'The pair a caller needs: where to upload, and what it belongs
        to.'
      properties:
        asset:
          allOf:
          - $ref: '#/components/schemas/MediaAsset'
          readOnly: true
        upload:
          allOf:
          - $ref: '#/components/schemas/PresignedUpload'
          readOnly: true
      required:
      - asset
      - upload
    UserDiagnostics:
      type: object
      description: The answer to "why is this person's access wrong".
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/DiagnosticUser'
          readOnly: true
        access:
          allOf:
          - $ref: '#/components/schemas/AccessDecision'
          readOnly: true
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionDiagnostic'
          readOnly: true
        events:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionEvent'
          readOnly: true
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/AccessOverride'
          readOnly: true
      required:
      - access
      - events
      - overrides
      - subscriptions
      - user
    VerifyEmailRequest:
      type: object
      description: For consuming a verification token.
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - token
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
