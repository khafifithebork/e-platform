  /api/v1/lessons/{id}/:
    get:
      operationId: lessons_retrieve
      description: |-
        One lesson, in full, if you may see it.

        ``AllowAny`` is deliberate and is what makes preview lessons work for
        people with no account: the resolver's first branch allows a preview
        before it ever asks who is calling, and a blanket ``IsAuthenticated`` here
        would refuse them before that branch ran. Authentication is not the gate —
        entitlement is, and it decides for anonymous callers too.

        ``RetrieveModelMixin`` alone, **not** ``ReadOnlyModelViewSet``. That is a
        security control, not a style choice, and it was written the wrong way
        first: ``ReadOnlyModelViewSet`` also provides ``list``, and
        ``has_object_permission`` is never called for a list — so ``GET
        /lessons/`` returned every visible lesson, bodies included, to anonymous
        callers. The docstring claimed "retrieve only" while the class shipped the
        opposite.

        Object-level permissions cannot gate a collection. Anything that returns
        many lessons must either run the resolver per row or filter by a second
        access rule, and a second rule is the one that drifts (invariant 3). So
        there is no such route: curriculum comes from the public catalogue, which
        shows structure without content.
      summary: Read a lesson
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this lesson.
        required: true
      tags:
      - learning
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatedLesson'
          description: ''
        '403':
          description: Entitlement denied. Problem Details with a stable `reason`
            and `cta` — see /problems/entitlement-denied.
        '404':
          description: No such lesson, or not published.
  /api/v1/lessons/{id}/media/upload-url/:
    post:
      operationId: lessons_media_upload_url_create
      description: |-
        Authorise one upload for one lesson.

        Throttled on its own scope: each call signs a URL that can write to our
        bucket, so an unthrottled version is a way to mint write grants without
        ever uploading through us.
      summary: Request a presigned upload URL
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - media
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UploadRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicket'
          description: ''
        '400':
          description: Unsupported content type.
        '404':
          description: No such lesson of yours.
        '409':
          description: The current asset cannot be replaced.
  /api/v1/media-assets/{id}/complete/:
    post:
      operationId: media_assets_complete_create
      description: Confirm an upload landed, and verify it before believing it.
      summary: Confirm an upload
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - media
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
          description: ''
        '404':
          description: No such asset of yours.
        '409':
          description: Not awaiting an upload.
        '422':
          description: Nothing uploaded, too large, or not the declared type.
components:
  schemas:
    Access:
      type: object
      description: |-
        The entitlement decision, as the frontend receives it.

        Declared as a serializer purely so the OpenAPI schema describes the shape
        and invariant 16's generated types are real rather than `unknown`. Nothing
        constructs it — the resolver produces the values.
      properties:
        allowed:
          type: boolean
          readOnly: true
        reason:
          type: string
          readOnly: true
        cta:
          type: string
          readOnly: true
          nullable: true
      required:
      - allowed
      - cta
      - reason
    AccessDecision:
      type: object
      properties:
        allowed:
          type: boolean
          readOnly: true
        reason:
          type: string
          readOnly: true
        cta:
          type: string
          readOnly: true
          nullable: true
      required:
      - allowed
      - cta
      - reason
    AccessOverride:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reason:
          type: string
          description: Why this was granted. Required — an unexplained grant is the
            boolean again.
        granted_by_email:
          type: string
          format: email
          readOnly: true
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - ends_at
      - granted_by_email
      - id
      - reason
      - starts_at
    ActionEnum:
      enum:
      - SUBMITTED
      - APPROVED
      - REJECTED
      - CHANGES_REQUESTED
      type: string
      description: |-
        * `SUBMITTED` - Submitted for review
        * `APPROVED` - Approved
        * `REJECTED` - Rejected
        * `CHANGES_REQUESTED` - Changes requested
    ContentTypeEnum:
      enum:
      - audio/mp4
      - audio/mpeg
      - audio/webm
      - video/mp4
      - video/quicktime
      - video/webm
      type: string
      description: |-
        * `audio/mp4` - audio/mp4
        * `audio/mpeg` - audio/mpeg
        * `audio/webm` - audio/webm
        * `video/mp4` - video/mp4
        * `video/quicktime` - video/quicktime
        * `video/webm` - video/webm
    Course:
      type: object
      description: |-
        An instructor's view of their own course.

        ``status``, ``published_at`` and ``instructor`` are read-only, and that is
        a security control rather than a convenience. A writable ``status`` would
        hand every instructor the publish button — the one thing
        ``architecture.md`` §3 promises they do not have — and a writable
        ``instructor`` would let them assign a course to somebody else, or claim
        one.

        Ownership comes from the session in ``perform_create``, never from the
        request body.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          description: The public URL. Unique across the catalogue, not per instructor.
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 200
        description:
          type: string
        language:
          type: integer
        level:
          $ref: '#/components/schemas/LevelEnum'
        skill_areas:
          description: Free-form tags, e.g. ['listening', 'grammar'].
        status:
          allOf:
          - $ref: '#/components/schemas/CourseStatusEnum'
          readOnly: true
          description: |-
            Never writable from a request body. Changed only by services.transition.

            * `DRAFT` - Draft
            * `IN_REVIEW` - In review
            * `PUBLISHED` - Published
            * `ARCHIVED` - Archived
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Set when an admin approves. Null means it has never been live.
        instructor:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - instructor
      - language
      - level
      - published_at
      - slug
      - status
      - title
      - updated_at
    CourseRequest:
      type: object
      description: |-
        An instructor's view of their own course.

        ``status``, ``published_at`` and ``instructor`` are read-only, and that is
        a security control rather than a convenience. A writable ``status`` would
        hand every instructor the publish button — the one thing
        ``architecture.md`` §3 promises they do not have — and a writable
        ``instructor`` would let them assign a course to somebody else, or claim
        one.

        Ownership comes from the session in ``perform_create``, never from the
        request body.
      properties:
        slug:
          type: string
          minLength: 1
          description: The public URL. Unique across the catalogue, not per instructor.
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        language:
          type: integer
        level:
          $ref: '#/components/schemas/LevelEnum'
        skill_areas:
          description: Free-form tags, e.g. ['listening', 'grammar'].
      required:
      - language
      - level
      - slug
      - title
    CourseReviewEvent:
      type: object
      description: |-
        Read-only in both directions.

        Every field is read-only *and* the viewset is read-only. That is
        deliberate belt-and-braces: if someone later swaps the base class for a
        ModelViewSet — the obvious "while I'm here" change — the serializer still
        refuses to write, and an instructor still cannot forge their own approval.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        course:
          type: string
          format: uuid
          readOnly: true
        actor:
          type: string
          format: uuid
          readOnly: true
        actor_email:
          type: string
          format: email
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        notes:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - actor_email
      - course
      - created_at
      - id
      - notes
    CourseStatusEnum:
      enum:
      - DRAFT
      - IN_REVIEW
      - PUBLISHED
      - ARCHIVED
      type: string
      description: |-
        * `DRAFT` - Draft
        * `IN_REVIEW` - In review
        * `PUBLISHED` - Published
        * `ARCHIVED` - Archived
    DiagnosticUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          type: string
          readOnly: true
      required:
      - email
      - id
      - role
    EmailOnlyRequest:
      type: object
      description: For resending a verification email.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - email
    EventTypeEnum:
      enum:
      - TRIAL_STARTED
      - ACTIVATED
      - RENEWED
      - PAYMENT_FAILED
      - CANCELLATION_REQUESTED
      - CANCELED
      - EXPIRED
      type: string
      description: |-
        * `TRIAL_STARTED` - Trial started
        * `ACTIVATED` - Activated
        * `RENEWED` - Renewed
        * `PAYMENT_FAILED` - Payment failed
        * `CANCELLATION_REQUESTED` - Cancellation requested
        * `CANCELED` - Canceled
        * `EXPIRED` - Expired
    GatedLesson:
      type: object
      description: |-
        A lesson in full, including its content.

        The counterpart to ``PublicLessonSerializer``, which omits ``body``
        entirely. Two serializers rather than one with a conditional field, as
        ADR-008 §6 anticipated: the public one *cannot* render paid content
        because it has no such field, and this one is only reachable behind
        ``IsEntitledToLesson``. A single serializer branching on a flag would put
        the access decision inside the I/O layer, which invariant 2 forbids and
        which is one wrong branch away from serving everything.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        course_slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        section:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        lesson_type:
          allOf:
          - $ref: '#/components/schemas/LessonTypeEnum'
          readOnly: true
        position:
          type: integer
          readOnly: true
        is_preview:
          type: boolean
          readOnly: true
          description: Watchable without a subscription. The entitlement resolver
            reads this in M4; it grants nothing on its own.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - course_slug
      - created_at
      - id
      - is_preview
      - lesson_type
      - position
      - section
      - slug
      - title
      - updated_at
    Language:
      type: object
      properties:
        code:
          type: string
          description: ISO 639 code, e.g. 'es'. The natural key.
          maxLength: 10
        name:
          type: string
          description: English name, e.g. 'Spanish'.
          maxLength: 100
        native_name:
          type: string
          description: e.g. 'Español'.
          maxLength: 100
      required:
      - code
      - name
      - native_name
    Lesson:
      type: object
      description: |-
        ``section`` is writable, and the view narrows its queryset to the course
        in the URL — see ``InstructorLessonViewSet.get_serializer``. That is what
        turns another course's section id into a 400 rather than a cross-course
        write, a constraint the database cannot express because both rows are
        individually valid.

        ``is_preview`` is **read-only**, and that is a revenue control rather than
        a nicety. A preview lesson is free to everyone: it is the resolver's first
        branch, allowed before the caller is even identified. An instructor who
        could set the flag could mark every lesson in their course a preview and
        hand the whole thing away — not only their own work, because the
        subscription that pays for it is shared across the catalogue.

        Previews are therefore chosen by an admin, in the same review that decides
        publication (ADR-007 §2). This was writable when the field was inert, and
        only became a giveaway once M4 gave it meaning.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        course:
          type: string
          format: uuid
          readOnly: true
        section:
          type: string
          format: uuid
        slug:
          type: string
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 200
        body:
          type: string
        lesson_type:
          $ref: '#/components/schemas/LessonTypeEnum'
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_preview:
          type: boolean
          readOnly: true
          description: Watchable without a subscription. The entitlement resolver
            reads this in M4; it grants nothing on its own.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - course
      - created_at
      - id
      - is_preview
      - position
      - section
      - slug
      - title
      - updated_at
    LessonReorderRequest:
      type: object
      description: Shape only. Whether the ids are *yours* is decided in the service.
      properties:
        order:
          type: array
          items:
            type: string
            format: uuid
        section:
          type: string
          format: uuid
      required:
      - order
      - section
    LessonRequest:
      type: object
      description: |-
        ``section`` is writable, and the view narrows its queryset to the course
        in the URL — see ``InstructorLessonViewSet.get_serializer``. That is what
        turns another course's section id into a 400 rather than a cross-course
        write, a constraint the database cannot express because both rows are
        individually valid.

        ``is_preview`` is **read-only**, and that is a revenue control rather than
        a nicety. A preview lesson is free to everyone: it is the resolver's first
        branch, allowed before the caller is even identified. An instructor who
        could set the flag could mark every lesson in their course a preview and
        hand the whole thing away — not only their own work, because the
        subscription that pays for it is shared across the catalogue.

        Previews are therefore chosen by an admin, in the same review that decides
        publication (ADR-007 §2). This was writable when the field was inert, and
        only became a giveaway once M4 gave it meaning.
      properties:
        section:
          type: string
          format: uuid
        slug:
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
        lesson_type:
          $ref: '#/components/schemas/LessonTypeEnum'
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - position
      - section
      - slug
      - title
    LessonTypeEnum:
      enum:
      - VIDEO
      - AUDIO
      - TEXT
      - RESOURCE
      type: string
      description: |-
        * `VIDEO` - Video
        * `AUDIO` - Audio
        * `TEXT` - Text
        * `RESOURCE` - Resource
    LevelEnum:
      enum:
      - A1
      - A2
      - B1
      - B2
      - C1
      - C2
      type: string
      description: |-
        * `A1` - A1 — Beginner
        * `A2` - A2 — Elementary
        * `B1` - B1 — Intermediate
        * `B2` - B2 — Upper intermediate
        * `C1` - C1 — Advanced
        * `C2` - C2 — Proficient
    LoginRequest:
      type: object
      description: |-
        Login input.

        No password validators here. They exist to stop weak passwords being
        *chosen*; applying them at login would reject a valid credential set before
        a stricter policy, and would leak the policy to anyone probing.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    Me:
      type: object
      description: |-
        The signed-in user.

        A field allowlist rather than a ModelSerializer with `exclude`. With
        `exclude`, every field added to User later is exposed by default and
        somebody has to remember to hide it; here the default is that new fields
        stay private until named.

        `is_staff`, `is_superuser`, `groups` and `user_permissions` are therefore
        absent: they are internal authorisation detail, and the frontend branches
        on `role`.

        `access` carries the entitlement decision, as architecture.md section 6.2
        requires, "so the frontend never re-derives access rules". It is the same
        resolver the gated endpoints use — `resolve_account_access` is the
        lesson-independent half of `resolve_access`, not a second copy, because two
        implementations of these rules disagree the day one of them changes
        (invariant 3).

        A reason and a call to action, never a bare boolean: the interface has to
        tell "start a trial" from "your card failed", and a boolean would put that
        inference in the frontend.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          type: string
          readOnly: true
        is_email_verified:
          type: boolean
          readOnly: true
        profile:
          allOf:
          - $ref: '#/components/schemas/StudentProfile'
          readOnly: true
        access:
          allOf:
          - $ref: '#/components/schemas/Access'
          readOnly: true
      required:
      - access
      - email
      - id
      - is_email_verified
      - profile
      - role
    MediaAsset:
      type: object
      description: |-
        The instructor's view of their own asset.

        ``provider_playback_id`` is absent, deliberately — abuse case 10. It is
        the handle that plays the video, it belongs only inside a minted token,
        and an upload screen has no use for it. A field that appears where it is
        not needed is a field that leaks somewhere it is not checked.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        lesson:
          type: string
          format: uuid
          readOnly: true
          description: One asset per lesson. Two would be two answers to what plays
            here.
        status:
          allOf:
          - $ref: '#/components/schemas/MediaAssetStatusEnum'
          readOnly: true
        source_bytes:
          type: integer
          readOnly: true
        duration_seconds:
          type: integer
          readOnly: true
          nullable: true
        error_message:
          type: string
          readOnly: true
        retry_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - duration_seconds
      - error_message
      - id
      - lesson
      - retry_count
      - source_bytes
      - status
      - updated_at
    MediaAssetStatusEnum:
      enum:
      - PENDING
      - UPLOADED
      - TRANSCODING
      - READY
      - FAILED
      type: string
      description: |-
        * `PENDING` - Awaiting upload
        * `UPLOADED` - Uploaded, not yet processed
        * `TRANSCODING` - Being processed by the provider
        * `READY` - Playable
        * `FAILED` - Failed
    PaginatedCourseList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Course'
    PaginatedCourseReviewEventList:
      type: object
      required:
      - results
