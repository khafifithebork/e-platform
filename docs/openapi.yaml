openapi: 3.0.3
info:
  title: Language Platform API
  version: 1.0.0
  description: Curated language-learning subscription platform.
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Establish a session.

        `authenticate` runs through AxesStandaloneBackend first, so a locked
        account fails here exactly as a wrong password does — and says the same
        thing. Telling a caller "this account is locked" would confirm the address
        exists and tell them their guessing worked well enough to matter.

        Deliberately not CSRF-exempt. Forcing a victim's browser to sign in as the
        attacker is a real attack: everything they do next is recorded against the
        wrong account.
      summary: Sign in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: Signed in. A session cookie is set.
        '400':
          description: Credentials refused, or the account is locked. Deliberately
            one answer.
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Destroy the session.

        Idempotent, and permitted while unauthenticated: a client retrying after a
        timeout should not receive an error for succeeding twice, and refusing an
        anonymous caller would leak whether their session was still alive.
      summary: Sign out
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: Signed out. Idempotent.
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: |-
        Who am I.

        Identity comes from the session and nothing else. There is no path
        parameter, no query parameter and no header that selects a user — a
        stronger guarantee than filtering one out, because there is nothing to
        filter. architecture.md section 4.4 calls fetching by a client-supplied
        identifier the single most common IDOR in DRF codebases; the fix here is
        to never accept one.
      summary: The signed-in user
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '403':
          description: Not signed in.
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: |-
        Change the password of the signed-in user.

        The only endpoint here that requires authentication, so it uses the
        project default rather than AllowAny.
      summary: Change your password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Password changed.
        '400':
          description: Current password wrong, or new password rejected.
  /api/v1/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      description: |-
        Send a reset link.

        Always 202. §6.2 is explicit that this must never reveal whether an account
        exists, and a reset endpoint is the most attractive enumeration oracle in
        any application because it is designed to be used by people who are locked
        out and therefore unauthenticated.
      summary: Request a password reset
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '202':
          description: Accepted. Identical for unknown addresses.
  /api/v1/auth/password/reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      summary: Set a new password with a reset token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: Password changed. All sessions are invalidated.
        '400':
          description: Token invalid, or the new password was rejected.
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: |-
        Create an account and send a verification email.

        Always answers 202 with the same body. That is abuse case 1: a differing
        status, body, or field error would let someone test an address list against
        this endpoint and learn who has an account here.

        The response is 202 rather than 201 because the meaningful part — the email
        — has not happened yet, and because 201 with a Location header would imply
        a resource the caller may now fetch.
      summary: Register an account
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '202':
          description: Accepted. Identical whether or not the address was free.
        '400':
          description: Malformed input or a password that fails validation.
  /api/v1/auth/resend-verification/:
    post:
      operationId: auth_resend_verification_create
      description: |-
        Issue a fresh verification token.

        Same uniform response for the same reason, and it covers three cases that
        must look identical: no such account, an account already verified, and a
        genuine resend.
      summary: Resend the verification email
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '202':
          description: Accepted. Identical for unknown and verified addresses.
  /api/v1/auth/verify-email/:
    post:
      operationId: auth_verify_email_create
      description: |-
        Consume a verification token.

        Unlike registration this one may fail visibly: the caller is holding a
        token and needs to know it did not work. It still says only that the token
        is invalid, never which of unknown, expired or already-used applies —
        telling them would turn a failed guess into information.
      summary: Verify an email address
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: Email address verified.
        '400':
          description: Token unknown, expired or already used — deliberately not distinguished.
components:
  schemas:
    EmailOnlyRequest:
      type: object
      description: For resending a verification email.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - email
    LoginRequest:
      type: object
      description: |-
        Login input.

        No password validators here. They exist to stop weak passwords being
        *chosen*; applying them at login would reject a valid credential set before
        a stricter policy, and would leak the policy to anyone probing.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    Me:
      type: object
      description: |-
        The signed-in user.

        A field allowlist rather than a ModelSerializer with `exclude`. With
        `exclude`, every field added to User later is exposed by default and
        somebody has to remember to hide it; here the default is that new fields
        stay private until named.

        `is_staff`, `is_superuser`, `groups` and `user_permissions` are therefore
        absent: they are internal authorisation detail, and the frontend branches
        on `role`.

        No `access` object until M4 (architecture.md section 6.2). Adding an
        optional object later is backward compatible; shipping a fake one now would
        invite the frontend to depend on a shape with no logic behind it.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          type: string
          readOnly: true
        is_email_verified:
          type: boolean
          readOnly: true
        profile:
          allOf:
          - $ref: '#/components/schemas/StudentProfile'
          readOnly: true
      required:
      - email
      - id
      - is_email_verified
      - profile
      - role
    PasswordChangeRequest:
      type: object
      description: |-
        Change a signed-in user's password.

        The current password is required even though the caller is authenticated —
        a session left open on a shared machine is exactly what this stops.
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - current_password
      - new_password
    PasswordResetConfirmRequest:
      type: object
      description: Consume a reset token and set a new password.
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - new_password
      - token
    RegisterRequest:
      type: object
      description: |-
        Registration input.

        Two fields, and that is the security control. DRF ignores fields it does
        not declare, so `role`, `is_staff` and `is_superuser` in a request body go
        nowhere — there is no path from here to them. Abuse case 3.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    StudentProfile:
      type: object
      description: Output only.
      properties:
        display_name:
          type: string
      required:
      - display_name
    VerifyEmailRequest:
      type: object
      description: For consuming a verification token.
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - token
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
